<style>
:root{
  --paper:#F5F1E7; --card:#FFFDF8; --ink:#2B2923; --ink-2:#6B655A;
  --line:#E3DCCB; --teal:#2F4B42; --teal-deep:#22372F; --teal-soft:#E7ECE7;
  --gold:#A97A3E; --gold-soft:#F3EAD9; --plum:#6D4B45; --plum-soft:#F0E8E3;
  --blue:#44607A; --blue-soft:#E8EDF2;
  --r:14px; --shadow:0 1px 2px rgba(43,41,35,.05),0 4px 14px rgba(43,41,35,.06);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{
  background:var(--paper); color:var(--ink);
  font-family:"Noto Sans SC",-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  font-size:15px; line-height:1.6; max-width:720px; margin:0 auto; min-height:100vh;
}
h1,h2,h3,.serif{font-family:"Noto Serif SC","Songti SC",serif}
a{color:inherit;text-decoration:none}
button{font-family:inherit;border:none;background:none;cursor:pointer;color:inherit}

/* ===== 顶部条 ===== */
#topbar{
  position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;
  padding:12px 14px;background:rgba(245,241,231,.94);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);
}
#topbar .icon-btn{
  width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;
  color:var(--teal);flex:none;
}
#topbar .icon-btn:active{background:rgba(47,75,66,.08)}
#topbar .icon-btn.hidden{visibility:hidden}
#crumb{flex:1;min-width:0;display:flex;align-items:center;gap:6px;font-size:14px;color:var(--ink-2);overflow:hidden;white-space:nowrap}
#crumb b{font-weight:600;color:var(--ink);overflow:hidden;text-overflow:ellipsis}
#crumb .sep{color:#B9B2A2}

/* ===== 搜索面板 ===== */
#searchPanel{display:none;padding:10px 14px 14px;background:var(--paper);border-bottom:1px solid var(--line)}
#searchPanel.open{display:block}
#searchPanel .box{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:2px 12px}
#searchPanel input{flex:1;border:none;outline:none;background:transparent;font-size:16px;padding:11px 0;color:var(--ink);font-family:inherit}
#searchPanel input::placeholder{color:#A7A08F}
#searchPanel .clear{color:#A7A08F;font-size:14px;padding:4px 6px}

/* ===== 主视图 ===== */
#view{min-height:60vh;padding:14px 14px 28px}
.foot{padding:22px 24px 34px;text-align:center;color:#9C9584;font-size:12px;border-top:1px solid var(--line);margin:0 14px}

/* ===== 首页 ===== */
.hero{padding:26px 6px 8px;text-align:center}
.hero .seal{
  width:58px;height:58px;margin:0 auto 14px;border-radius:16px;background:var(--teal);
  display:flex;align-items:center;justify-content:center;color:var(--paper);box-shadow:var(--shadow);
}
.hero h1{font-size:26px;font-weight:700;letter-spacing:2px}
.hero .sub{margin-top:6px;font-size:13px;color:var(--ink-2);letter-spacing:1px}
.hero .desc{margin:14px auto 0;max-width:420px;font-size:13px;color:var(--ink-2);line-height:1.8}

.stat{display:flex;justify-content:center;gap:0;margin:20px 0 6px}
.stat .item{flex:1;max-width:130px;text-align:center;padding:12px 4px}
.stat .num{font-family:"Noto Serif SC",serif;font-size:24px;font-weight:700;color:var(--teal)}
.stat .lbl{font-size:12px;color:var(--ink-2);margin-top:2px}

.cat-grid{display:grid;grid-template-columns:1fr;gap:12px;margin-top:14px}
.cat-card{
  display:block;background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:18px 16px;box-shadow:var(--shadow);position:relative;overflow:hidden;
}
.cat-card:active{transform:scale(.985)}
.cat-card .row{display:flex;align-items:center;gap:14px}
.cat-card .ic{width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;flex:none}
.cat-card .t{font-size:18px;font-weight:700;font-family:"Noto Serif SC",serif}
.cat-card .d{font-size:12px;color:var(--ink-2);margin-top:3px}
.cat-card .n{margin-left:auto;text-align:right;flex:none}
.cat-card .n b{font-size:22px;font-family:"Noto Serif SC",serif;display:block;line-height:1.2}
.cat-card .n span{font-size:11px;color:var(--ink-2)}
.cat-card .arrow{position:absolute;right:16px;bottom:16px;color:#C9C1AE}
.cat-card.prod .ic{background:var(--gold-soft);color:var(--gold)}
.cat-card.talent .ic{background:var(--teal-soft);color:var(--teal)}
.cat-card.proj .ic{background:var(--plum-soft);color:var(--plum)}
.cat-card.prod{border-top:3px solid var(--gold)}
.cat-card.talent{border-top:3px solid var(--teal)}
.cat-card.proj{border-top:3px solid var(--plum)}
.cat-card .n b.prod{color:var(--gold)}
.cat-card .n b.talent{color:var(--teal)}
.cat-card .n b.proj{color:var(--plum)}

.home-note{margin:24px 6px 0;font-size:12px;color:#9C9584;line-height:1.9}

/* ===== 二级类别页 ===== */
.section-h{padding:14px 6px 10px}
.section-h h2{font-size:20px;font-weight:700}
.section-h p{font-size:12px;color:var(--ink-2);margin-top:3px}
.sub-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.sub-card{
  display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);
  border-radius:var(--r);padding:14px;box-shadow:var(--shadow);min-height:60px;
}
.sub-card:active{transform:scale(.985)}
.sub-card .dot{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:none}
.sub-card .nm{flex:1;font-size:15px;font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub-card .ct{font-size:12px;color:var(--ink-2);flex:none}
.sub-card .ct b{font-size:15px;color:var(--ink);font-family:"Noto Serif SC",serif}
.type-prod .dot{background:var(--gold-soft);color:var(--gold)}
.type-talent .dot{background:var(--teal-soft);color:var(--teal)}
.type-proj .dot{background:var(--plum-soft);color:var(--plum)}

/* ===== 人员列表 ===== */
.list-h{padding:14px 6px 10px;display:flex;align-items:baseline;gap:10px}
.list-h h2{font-size:19px;font-weight:700;font-family:"Noto Serif SC",serif}
.list-h span{font-size:12px;color:var(--ink-2)}
.person-list{display:grid;grid-template-columns:1fr;gap:10px;margin-top:8px}
.p-card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:14px 14px 12px;box-shadow:var(--shadow);cursor:pointer;position:relative;
}
.p-card:active{transform:scale(.985)}
.p-card .top{display:flex;align-items:flex-start;gap:10px}
.p-card .nm{flex:1;min-width:0}
.p-card .nm h3{font-size:17px;font-weight:700;font-family:"Noto Serif SC",serif;line-height:1.4;word-break:break-all}
.p-card .tag{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.p-card .tag i{
  font-style:normal;font-size:11px;padding:2px 8px;border-radius:20px;background:var(--teal-soft);
  color:var(--teal-deep);border:1px solid #D5E0D5;
}
.p-card .tag i.g{background:var(--gold-soft);color:#7C5A28;border-color:#E7D8B8}
.p-card .sub{font-size:12.5px;color:var(--ink-2);margin-top:8px;line-height:1.6;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.p-card .call{
  margin-top:10px;display:flex;align-items:center;gap:8px;width:100%;justify-content:center;
  background:var(--teal);color:#fff;border-radius:10px;padding:11px 10px;font-size:14px;font-weight:500;
}
.p-card .call:active{background:var(--teal-deep)}
.p-card .call svg{flex:none}
.p-card .open{position:absolute;top:14px;right:12px;color:#C9C1AE}

/* ===== 详情页 ===== */
.p-detail{max-width:520px;margin:0 auto}
.pd-head{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px 18px;box-shadow:var(--shadow);text-align:center;margin-top:6px}
.pd-head h2{font-size:24px;font-weight:700;font-family:"Noto Serif SC",serif;word-break:break-all}
.pd-head .fm{margin-top:4px;font-size:13px;color:var(--ink-2)}
.pd-head .tags{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:12px}
.pd-head .tags i{font-style:normal;font-size:12px;padding:3px 10px;border-radius:20px;background:var(--teal-soft);color:var(--teal-deep);border:1px solid #D5E0D5}
.pd-call{
  margin-top:14px;display:flex;align-items:center;justify-content:center;gap:10px;width:100%;
  background:var(--teal);color:#fff;border-radius:12px;padding:15px;font-size:16px;font-weight:500;

.pd-call:active{background:var(--teal-deep)}
.pd-call small{font-size:12px;font-weight:400;opacity:.75}
.pd-body{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:6px 18px;margin-top:12px;box-shadow:var(--shadow)}
.pd-row{display:flex;gap:14px;padding:13px 0;border-bottom:1px dashed var(--line)}
.pd-row:last-child{border-bottom:none}
.pd-row .k{flex:none;width:74px;font-size:13px;color:var(--ink-2);padding-top:1px}
.pd-row .v{flex:1;font-size:13.5px;color:var(--ink);white-space:pre-wrap;word-break:break-all;line-height:1.7}
.pd-row .v .cls{color:var(--gold)}
.pd-sec{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin-top:12px;box-shadow:var(--shadow)}
.pd-sec h4{font-size:14px;font-weight:600;color:var(--teal-deep);display:flex;align-items:center;gap:8px;margin-bottom:8px}
.pd-sec .txt{font-size:13.5px;color:var(--ink);white-space:pre-wrap;line-height:1.8}
.pd-sec .txt.mut{color:var(--ink-2)}

/* ===== 搜索页 ===== */
.search-h{padding:14px 6px 4px}
.search-h h2{font-size:19px;font-weight:700;font-family:"Noto Serif SC",serif}
.search-h p{font-size:12px;color:var(--ink-2);margin-top:2px}
.empty{padding:60px 20px;text-align:center;color:#A7A08F;font-size:13px}
.empty .big{font-size:15px;margin-bottom:6px;color:#8F8877}

@media (min-width:768px){
  body{max-width:720px;border-left:1px solid var(--line);border-right:1px solid var(--line)}
  .sub-grid{grid-template-columns:1fr 1fr 1fr}
  .person-list{grid-template-columns:1fr 1fr;gap:12px}

</style>

function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function cleanName(n){return esc(n).replace(/\s+/g,' ').trim()}
function catCounts(type){
  const key=PKEY[type], cm={};
  PEOPLE.forEach(p=>(p[key]||[]).forEach(c=>{cm[c]=(cm[c]||0)+1}));
  return cm;
}
function catsOf(type){
  const cm=catCounts(type);
  return CAT_ORDER[type].filter(c=>cm[c]).map(c=>({name:c,count:cm[c]}));
}
function peopleOf(type,cat){
  const key=PKEY[type];
  return PEOPLE.map((p,i)=>({p,i})).filter(x=>(x.p[key]||[]).includes(cat));
}
function typeTotal(type){return PEOPLE.filter(p=>(p[PKEY[type]]||[]).length).length}

let stack=['#/'];

function go(h){stack.push(h);location.hash=h}
function back(){
  stack.pop();
  const prev=stack.length?stack[stack.length-1]:'#/';
  if(prev===location.hash){stack=['#/'];location.hash='#/'}
  else location.hash=prev;
}

function setCrumb(parts){
  crumb.innerHTML=parts.map((p,i)=>{
    if(i===parts.length-1) return '<b>'+esc(p)+'</b>';
    return '<span>'+esc(p)+'</span><span class="sep">/</span>';
  }).join('');
  backBtn.classList.toggle('hidden',parts.length<=1);
}

function personCard(x,type){
  const p=x.p, idx=x.i;
  const tags=[];
  if(p.c) tags.push('<i>'+esc(p.c)+'</i>');
  if(p.a) tags.push('<i class="g">'+esc(p.a)+'</i>');
  let sub='';
  if(p.o) sub+=esc(p.o);
  if(p.y) sub+=' · '+esc(p.y);
  if(!sub&&p.m) sub=esc(p.m);
  const brief = p.s||p.r||p.m||p.g||'';
  const b2 = sub? (brief? sub+'｜'+esc(brief).slice(0,60):sub) : (brief?esc(brief).slice(0,60):'');
  return '<div class="p-card" onclick="go(\'#/p/'+idx+'\')">'
    +'<div class="top"><div class="nm"><h3>'+cleanName(p.n)+'</h3>'
    +'<div class="tag">'+tags.join('')+'</div></div>'
    +'<span class="open">'+ICO.chev+'</span></div>'
    +(b2?'<div class="sub">'+b2+'</div>':'')
    +(p.p?'<a class="call" href="tel:'+esc(p.p)+'" onclick="event.stopPropagation()">'+ICO.phone+' 拨打电话 '+esc(p.p)+'</a>':'')
    +'</div>';
}

function renderHome(){
  setCrumb(['光速甄选 · 学长资源站']);
  const tp=typeTotal('prod'), tt=typeTotal('talent'), tj=typeTotal('proj');
  view.innerHTML=''
    +'<section class="hero">'
    +'<div class="seal">'+ICO.prod.replace('width="26"','width="30"').replace('height="26"','height="30"')+'</div>'
    +'<h1>光速甄选 · 学长资源站</h1>'
    +'<div class="sub">按需检索 · 一键直达 · 学长互助</div>'
    +'<p class="desc">汇集光速学堂学长问卷盘点的好物、专长与项目资源。按分类找到对应学长，点击即可直接电话联系。</p>'
    +'</section>'
    +'<div class="stat">'
    +'<div class="item"><div class="num">'+tp+'</div><div class="lbl">产品好物</div></div>'
    +'<div class="item"><div class="num">'+tt+'</div><div class="lbl">专业人才</div></div>'
    +'<div class="item"><div class="num">'+tj+'</div><div class="lbl">项目资源</div></div>'
    +'</div>'
    +'<nav class="cat-grid">'
    +'<a class="cat-card prod" href="#/cat/prod"><div class="row"><div class="ic">'+ICO.prod+'</div><div><div class="t">产品好物</div><div class="d">素食茶香 · 中医养生 · 供应链</div></div><div class="n"><b class="prod">'+tp+'</b><span>位学长</span></div></div></a>'
    +'<a class="cat-card talent" href="#/cat/talent"><div class="row"><div class="ic">'+ICO.talent+'</div><div><div class="t">专业人才</div><div class="d">法律财税 · 健康管理 · 新媒体</div></div><div class="n"><b class="talent">'+tt+'</b><span>位学长</span></div></div></a>'
    +'<a class="cat-card proj" href="#/cat/proj"><div class="row"><div class="ic">'+ICO.proj+'</div><div><div class="t">项目资源</div><div class="d">文旅康养 · 场地渠道 · 创业</div></div><div class="n"><b class="proj">'+tj+'</b><span>位学长</span></div></div></a>'
    +'</nav>'
    +'<p class="home-note">使用方式：选择分类 → 进入对应领域 → 查看学长信息 → 点击号码直接拨打电话。信息来自光速甄选问卷盘点，如有信息需更正请联系项目组。</p>';
}

function renderCat(type){
  const meta=TYPES[type];
  setCrumb(['光速甄选',meta.name]);
  const cats=catsOf(type);
  view.innerHTML=''
    +'<div class="section-h"><h2>'+meta.name+'</h2><p>'+esc(meta.desc)+'</p></div>'
    +'<div class="sub-grid type-'+meta.icon+'">'
    +cats.map(c=>'<a class="sub-card" href="#/list/'+type+'/'+encodeURIComponent(c.name)+'">'
      +'<span class="dot">'+ICO.dot+'</span><span class="nm">'+esc(c.name)+'</span><span class="ct"><b>'+c.count+'</b> 人</span></a>').join('')
    +'</div>';
}

function renderList(type,catName){
  const meta=TYPES[type];
  setCrumb(['光速甄选',meta.name,catName]);
  const list=peopleOf(type,catName);
  view.innerHTML=''
    +'<div class="list-h"><h2>'+esc(catName)+'</h2><span>'+list.length+' 位学长</span></div>'
    +'<div class="person-list">'+list.map(x=>personCard(x,type)).join('')+'</div>';
}

function renderPerson(idx){
  const p=PEOPLE[idx];
  if(!p){view.innerHTML='<div class="empty"><div class="big">未找到该学长</div><a href="#/">返回首页</a></div>';setCrumb(['光速甄选']);return}
  const name=cleanName(p.n);
  setCrumb(['光速甄选',name]);
  const tags=[];
  if(p.c)tags.push('<i>'+esc(p.c)+'</i>');
  if(p.a)tags.push('<i>'+esc(p.a)+'</i>');
  if(p.y)tags.push('<i>'+esc(p.y)+'</i>');
  const row=(k,v,cls)=>(v?'<div class="pd-row"><div class="k">'+k+'</div><div class="v'+(cls?' '+cls:'')+'">'+esc(v).replace(/\n/g,'<br>')+'</div></div>':'');
  view.innerHTML=''
    +'<div class="p-detail">'
    +'<div class="pd-head"><h2>'+name+'</h2>'
    +(p.d? '<div class="fm">'+esc(p.d)+'</div>':'')
    +'<div class="tags">'+tags.join('')+'</div>'
    +(p.p?'<a class="pd-call" href="tel:'+esc(p.p)+'">'+ICO.phone+' 拨打电话<small>'+esc(p.p)+'</small></a>':'')
    +'</div>'
    +'<div class="pd-body">'
    +row('职业 / 职位',p.o)
    +row('专业方向',p.m)
    +row('从业年限',p.y)
    +row('所在区域',p.a)
    +row('班级',p.c,'cls')
    +row('联系方式',p.p)
    +row('相关资质',p.t)
    +'</div>'
    +(p.s?'<div class="pd-sec"><h4>'+ICO.dot+' 主要擅长</h4><div class="txt">'+esc(p.s).replace(/\n/g,'<br>')+'</div></div>':'')
    +(p.r?'<div class="pd-sec"><h4>'+ICO.dot+' 推荐产品或服务</h4><div class="txt">'+esc(p.r).replace(/\n/g,'<br>')+'</div></div>':'')
    +(p.k?'<div class="pd-sec"><h4>'+ICO.dot+' 代表案例</h4><div class="txt mut">'+esc(p.k).replace(/\n/g,'<br>')+'</div></div>':'')
    +(p.g?'<div class="pd-sec"><h4>'+ICO.dot+' 项目</h4><div class="txt">'+esc(p.g).replace(/\n/g,'<br>')
      +(p.st?'<br><span style="font-size:12px;color:var(--ink-2)">项目阶段：'+esc(p.st)+'</span>':'')
      +'</div></div>':'')
    +(p.x?'<div class="pd-sec"><h4>'+ICO.dot+' 可对接资源</h4><div class="txt mut">'+esc(p.x).replace(/\n/g,'<br>')+'</div></div>':'')
    +(p.e?'<div class="pd-sec"><h4>'+ICO.dot+' 相关经验</h4><div class="txt mut">'+esc(p.e).replace(/\n/g,'<br>')+'</div></div>':'')
    +'</div>';
}

function renderSearch(q){
  setCrumb(['光速甄选','搜索：'+q]);
  const kw=q.trim().toLowerCase();
  if(!kw){view.innerHTML='<div class="empty"><div class="big">输入关键词开始搜索</div>可搜索姓名、法名、班级、专业、产品或项目</div>';return}
  const hits=[];
  PEOPLE.forEach((p,i)=>{
    const blob=(p.n+' '+p.c+' '+p.a+' '+p.o+' '+p.m+' '+p.d+' '+p.s+' '+p.r+' '+p.g+' '+p.x+' '+p.t).toLowerCase();
    if(blob.includes(kw))hits.push({p,i});
  });
  view.innerHTML=''
    +'<div class="search-h"><h2>搜索结果</h2><p>找到 '+hits.length+' 位相关学长</p></div>'
    +(hits.length?'<div class="person-list">'+hits.map(x=>personCard(x,null)).join('')+'</div>'
      :'<div class="empty"><div class="big">未找到相关学长</div>换个关键词试试，如「律师」「茶叶」「康养」</div>');
}

/* ===== 路由 ===== */
function route(){
  const parts=location.hash.replace(/^#\/?/,'').split('/').filter(Boolean);
  return parts;
}
function render(){
  const parts=route();
  const r0=parts[0]||'';
  if(r0==='cat'&&parts[1]&&TYPES[parts[1]])renderCat(parts[1]);
  else if(r0==='list'&&parts[1]&&TYPES[parts[1]]&&parts[2])renderList(parts[1],decodeURIComponent(parts[2]));
  else if(r0==='p'&&parts[1])renderPerson(parseInt(parts[1],10));
  else if(r0==='search')renderSearch(decodeURIComponent(parts[1]||''));
  else renderHome();
  window.scrollTo(0,0);
}

/* ===== 搜索交互 ===== */
searchBtn.addEventListener('click',()=>{
  searchPanel.classList.toggle('open');
  if(searchPanel.classList.contains('open'))searchInput.focus();
});
searchClear.addEventListener('click',()=>{searchInput.value='';searchInput.focus()});
searchInput.addEventListener('input',()=>{
  const q=searchInput.value;
  if(q){go('#/search/'+encodeURIComponent(q));searchInput.value=q}
  else if(route()[0]==='search')location.hash='#/';
});

backBtn.addEventListener('click',back);
window.addEventListener('hashchange',render);
render();
</script>

</html>
